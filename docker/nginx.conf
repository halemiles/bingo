# Replaces the image's default.conf. Static files only; no proxying, no
# dynamic content.

server {
    # IPv4 only: Docker's port mapping reaches the container over IPv4, and
    # an IPv6 listener crashes nginx on hosts with IPv6 disabled.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types application/json text/css application/javascript image/svg+xml;

    # nginx only inherits add_header into a location that has none of its
    # own, so every header lives here and no location adds any.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Tiny LAN app with unhashed file names: always revalidate (cheap 304s)
    # so edits to calls.json or a new image show up on the next refresh.
    add_header Cache-Control "no-cache" always;

    location = /config.json {
        alias /tmp/bingo/config.json;
        default_type application/json;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Text-only bodies are small; gzip the bigger ones for slower Wi-Fi.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
