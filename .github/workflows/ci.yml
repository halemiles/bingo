name: CI

# Changes that only touch Markdown (README, PLAN, CLAUDE.md) skip CI.
# Anything else in the same change still runs it.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + e2e (dev server, Chromium + Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (with coverage thresholds)
        run: npm run test:unit:coverage
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-dev
          path: playwright-report/
          retention-days: 7

  container:
    name: Docker image + e2e (container, Chromium + Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Build image
        run: docker build -t bingo:ci .

      - name: Bad config stops the container
        run: |
          if docker run --rm -e AUTO_MIN_SECONDS=20 -e AUTO_MAX_SECONDS=10 bingo:ci; then
            echo "Container started with an invalid config" >&2
            exit 1
          fi

      - name: Start container (hardened, as in compose.yaml)
        run: |
          docker run -d --name bingo -p 8080:8080 \
            --read-only --tmpfs /tmp:size=8m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            bingo:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' bingo)" = healthy ] && exit 0
            sleep 1
          done
          docker logs bingo
          exit 1

      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: e2e against the container
        run: npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:8080

      # Only nginx errors and unusual requests: the full access log is
      # thousands of 200/304 lines that bury the Playwright failures above.
      - name: Container log (errors and unusual requests)
        if: failure()
        run: docker logs bingo 2>&1 | { grep -vE '"(GET|HEAD) [^"]*" (200|304) ' || true; } | tail -n 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-container
          path: playwright-report/
          retention-days: 7
