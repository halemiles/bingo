<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bingo</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/atkinson-hyperlegible-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="prize">
      <div id="voice-controls" class="prize__voice">
        <button id="voice" class="btn" type="button" aria-pressed="false">Voice <kbd>M</kbd></button>
        <label id="voice-picker-wrap" class="voice-picker" hidden>
          <span class="visually-hidden">Voice to use</span>
          <select id="voice-picker" data-testid="voice-picker"></select>
        </label>
      </div>
      <button id="stage-banner" class="banner" type="button" data-testid="stage-banner" aria-haspopup="dialog">
        <span class="banner__label">Playing for:</span> <span id="stage-name" class="banner__name"></span>
      </button>
      <div class="prize__actions">
        <button id="check" class="btn" type="button" aria-haspopup="dialog">Check claim <kbd>C</kbd></button>
        <button id="next-stage" class="btn btn--quiet" type="button">Next stage <kbd>N</kbd></button>
      </div>
    </header>

    <main class="stage">
      <section class="balls" aria-label="Balls">
        <div class="current">
          <div id="current-ball" class="ball ball--current" data-testid="current-ball">
            <span class="ball__face"><span class="ball__number" id="current-number"></span></span>
          </div>
          <p id="current-call" class="call" data-testid="current-call"></p>
        </div>

        <div class="recent">
          <h2 class="label">Last 3 balls</h2>
          <ol id="recent-balls" class="recent__list" data-testid="recent-balls"></ol>
        </div>
      </section>

      <section class="board-wrap" aria-label="Board">
        <ol id="board" class="board" data-testid="board"></ol>
      </section>
    </main>

    <footer class="controls">
      <button id="release" class="btn btn--primary" type="button">
        Release ball <kbd>Space</kbd>
      </button>
      <button id="auto" class="btn" type="button" aria-pressed="false">
        <span id="auto-label">Auto</span> <kbd>A</kbd>
      </button>

      <label class="speed">
        <span>Every</span>
        <input id="speed" type="range" min="3" max="15" step="1" value="5" />
        <output id="speed-value" for="speed">5s</output>
      </label>

      <div id="countdown" class="countdown" data-testid="countdown" hidden>
        <div class="countdown__track"><div class="countdown__bar"></div></div>
        <span id="countdown-text"></span>
      </div>

      <button id="history" class="btn btn--quiet count" type="button" aria-haspopup="dialog" title="Game history">
        <span id="count" data-testid="count"></span> <kbd>H</kbd>
      </button>

      <span class="spacer"></span>

      <button id="undo" class="btn btn--quiet" type="button">Undo</button>
      <button id="new-game" class="btn btn--quiet" type="button">New game</button>
      <button id="fullscreen" class="btn btn--quiet" type="button">
        <span id="fullscreen-label">Fullscreen</span> <kbd>F</kbd>
      </button>
    </footer>

    <div id="announcer" class="visually-hidden" aria-live="assertive" aria-atomic="true"></div>

    <dialog id="confirm" class="dialog" aria-labelledby="confirm-message">
      <form method="dialog">
        <p id="confirm-message" class="dialog__message"></p>
        <div class="dialog__actions">
          <button id="confirm-cancel" class="btn" value="cancel">Cancel</button>
          <button id="confirm-ok" class="btn btn--danger" value="ok">OK</button>
        </div>
      </form>
    </dialog>

    <dialog id="stage-picker" class="dialog" aria-labelledby="stage-picker-title" data-testid="stage-picker">
      <form method="dialog">
        <h2 id="stage-picker-title" class="dialog__message">Playing for…</h2>
        <div id="stage-options" class="stage-options"></div>
        <div class="dialog__actions">
          <button class="btn btn--quiet" value="cancel">Cancel</button>
        </div>
      </form>
    </dialog>

    <dialog id="claim" class="dialog dialog--wide" aria-labelledby="claim-title" data-testid="claim">
      <form id="claim-form" class="claim" novalidate>
        <h2 id="claim-title" class="dialog__message">Check a claim</h2>

        <div id="claim-entry" class="claim__entry">
          <label id="claim-hint" class="claim__hint" for="claim-numbers"></label>
          <textarea id="claim-numbers" class="claim__input" spellcheck="false" autocomplete="off" inputmode="numeric" aria-describedby="claim-errors"></textarea>
          <ul id="claim-errors" class="claim__errors" role="alert"></ul>
          <div class="dialog__actions">
            <button id="claim-cancel" class="btn btn--quiet" type="button">Cancel</button>
            <button id="claim-submit" class="btn btn--primary" type="submit">Check</button>
          </div>
        </div>

        <div id="claim-result" class="claim__result" hidden>
          <p id="claim-verdict" class="claim__verdict" data-testid="claim-verdict" role="status"></p>
          <p id="claim-note" class="claim__note" data-testid="claim-note"></p>
          <div id="claim-lines" class="claim__lines" data-testid="claim-lines"></div>
          <div class="dialog__actions">
            <button id="claim-close" class="btn btn--quiet" type="button">Close</button>
            <button id="claim-again" class="btn" type="button">Check another</button>
            <button id="claim-next" class="btn btn--primary" type="button" hidden>Next stage</button>
            <button id="claim-new-game" class="btn btn--primary" type="button" hidden>New game</button>
          </div>
        </div>
      </form>
    </dialog>

    <dialog id="history-dialog" class="dialog dialog--wide" aria-labelledby="history-title" data-testid="history">
      <form method="dialog" class="history">
        <h2 id="history-title" class="dialog__message">Game history</h2>
        <p id="history-summary" class="history__summary" data-testid="history-summary"></p>
        <div id="history-timeline" class="history__timeline" data-testid="history-timeline" tabindex="0" aria-label="Everything that has happened this game, oldest first"></div>
        <div class="dialog__actions">
          <button id="history-download" class="btn" type="button">Download</button>
          <button id="history-close" class="btn btn--primary" value="close">Close</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
